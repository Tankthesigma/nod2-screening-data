<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340">

  <!-- Title -->
  <text x="150" y="28" font-family="Helvetica Neue, Helvetica, Arial" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">NOD2 Domains</text>

  <!-- Domain entries with rounded colored bars -->

  <!-- CARD - Gray -->
  <rect x="28" y="52" width="32" height="24" rx="5" fill="#B3B3B3"/>
  <text x="72" y="64" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="600" fill="#111827">CARD</text>
  <text x="72" y="78" font-family="Helvetica Neue, Helvetica, Arial" font-size="10" fill="#6b7280">Signaling domains</text>

  <!-- NBD - Blue -->
  <rect x="28" y="92" width="32" height="24" rx="5" fill="#0066CC"/>
  <text x="72" y="104" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="600" fill="#111827">NBD</text>
  <text x="72" y="118" font-family="Helvetica Neue, Helvetica, Arial" font-size="10" fill="#6b7280">Nucleotide binding</text>

  <!-- HD1 - Cyan -->
  <rect x="28" y="132" width="32" height="24" rx="5" fill="#00CCCC"/>
  <text x="72" y="144" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="600" fill="#111827">HD1</text>
  <text x="72" y="158" font-family="Helvetica Neue, Helvetica, Arial" font-size="10" fill="#6b7280">Helical domain 1</text>

  <!-- HD2 - Orange -->
  <rect x="28" y="172" width="32" height="24" rx="5" fill="#FF8C00"/>
  <text x="72" y="184" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="600" fill="#111827">HD2</text>
  <text x="72" y="198" font-family="Helvetica Neue, Helvetica, Arial" font-size="10" fill="#6b7280">Helical domain 2</text>

  <!-- LRR - Green -->
  <rect x="28" y="212" width="32" height="24" rx="5" fill="#32CD32"/>
  <text x="72" y="224" font-family="Helvetica Neue, Helvetica, Arial" font-size="13" font-weight="600" fill="#111827">LRR</text>
  <text x="72" y="238" font-family="Helvetica Neue, Helvetica, Arial" font-size="10" fill="#6b7280">Ligand recognition</text>

  <!-- Separator -->
  <line x1="28" y1="256" x2="272" y2="256" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Key Features label -->
  <text x="150" y="276" font-family="Helvetica Neue, Helvetica, Arial" font-size="11" font-weight="500" fill="#6b7280" text-anchor="middle">KEY FEATURES</text>

  <!-- R702W - Red circle -->
  <circle cx="44" cy="300" r="11" fill="#FF0000"/>
  <text x="66" y="296" font-family="Helvetica Neue, Helvetica, Arial" font-size="11" font-weight="600" fill="#111827">R702W</text>
  <text x="66" y="309" font-family="Helvetica Neue, Helvetica, Arial" font-size="9" fill="#6b7280">Crohn's mutation</text>

  <!-- Binding Pocket - Magenta circle -->
  <circle cx="185" cy="300" r="11" fill="#FF00FF"/>
  <text x="207" y="296" font-family="Helvetica Neue, Helvetica, Arial" font-size="11" font-weight="600" fill="#111827">Pocket</text>
  <text x="207" y="309" font-family="Helvetica Neue, Helvetica, Arial" font-size="9" fill="#6b7280">Binding site</text>

  <!-- Distance callout -->
  <text x="150" y="336" font-family="Helvetica Neue, Helvetica, Arial" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="600">79.4 Å apart (allosteric)</text>

</svg>