<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1920" width="1440" height="1920">
  <defs>
    <!-- Header gradient matching #E8825E -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8825E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4714D;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E8825E"/>
    </marker>
    
    <!-- Thick arrow marker -->
    <marker id="arrowheadBig" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#555"/>
    </marker>
    
    <!-- Glow filter for emphasis -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="1920" fill="url(#bgGrad)"/>
  
  <!-- ==================== HEADER ==================== -->
  <rect x="40" y="30" width="1360" height="70" rx="8" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="720" y="75" font-family="Calisto MT, Georgia, serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">NOD2 Structure &amp; Pathway</text>
  
  <!-- ==================== SECTION 1: BACTERIAL TRIGGER ==================== -->
  <g transform="translate(0, 120)">
    <!-- MDP molecule representation -->
    <rect x="570" y="0" width="300" height="100" rx="12" fill="white" stroke="#E8825E" stroke-width="2" filter="url(#shadow)"/>
    <text x="720" y="35" font-family="Calisto MT, Georgia, serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Bacterial Signal</text>
    <text x="720" y="65" font-family="Calisto MT, Georgia, serif" font-size="28" font-weight="bold" fill="#E8825E" text-anchor="middle">MDP</text>
    <text x="720" y="88" font-family="Calisto MT, Georgia, serif" font-size="12" fill="#666" text-anchor="middle">Muramyl Dipeptide</text>
    
    <!-- Arrow down -->
    <line x1="720" y1="105" x2="720" y2="145" stroke="#E8825E" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- ==================== SECTION 2: NOD2 RECOGNITION ==================== -->
  <g transform="translate(0, 280)">
    <!-- Section header -->
    <rect x="40" y="0" width="1360" height="40" rx="6" fill="#E8825E" opacity="0.15"/>
    <text x="720" y="28" font-family="Calisto MT, Georgia, serif" font-size="18" font-weight="bold" fill="#E8825E" text-anchor="middle">NOD2 RECOGNITION</text>
    
    <!-- WT Structure box -->
    <g transform="translate(80, 55)">
      <rect x="0" y="0" width="580" height="420" rx="10" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
      <rect x="0" y="0" width="580" height="45" rx="10" fill="#4A90A4"/>
      <rect x="0" y="35" width="580" height="10" fill="#4A90A4"/>
      <text x="290" y="30" font-family="Calisto MT, Georgia, serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Wild-Type NOD2</text>
      
      <!-- Image placeholder -->
      <rect x="15" y="55" width="550" height="300" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-dasharray="5,5"/>
      <text x="290" y="200" font-family="Arial, sans-serif" font-size="14" fill="#999" text-anchor="middle">[img1_wt_full_ISEF.png]</text>
      <text x="290" y="220" font-family="Arial, sans-serif" font-size="11" fill="#bbb" text-anchor="middle">Place full structure image here</text>
      
      <!-- Domain legend -->
      <g transform="translate(15, 365)">
        <rect x="0" y="0" width="18" height="12" fill="#808080"/>
        <text x="25" y="10" font-family="Arial, sans-serif" font-size="10" fill="#555">CARD</text>
        <rect x="80" y="0" width="18" height="12" fill="#3366CC"/>
        <text x="105" y="10" font-family="Arial, sans-serif" font-size="10" fill="#555">NBD</text>
        <rect x="155" y="0" width="18" height="12" fill="#FF9933"/>
        <text x="180" y="10" font-family="Arial, sans-serif" font-size="10" fill="#555">HD2</text>
        <rect x="230" y="0" width="18" height="12" fill="#339933"/>
        <text x="255" y="10" font-family="Arial, sans-serif" font-size="10" fill="#555">LRR</text>
        <circle cx="320" cy="6" r="6" fill="#FF00FF"/>
        <text x="335" y="10" font-family="Arial, sans-serif" font-size="10" fill="#555">Ligand</text>
      </g>
      
      <!-- Status -->
      <text x="290" y="405" font-family="Calisto MT, Georgia, serif" font-size="14" fill="#4A90A4" text-anchor="middle" font-weight="bold">Normal Function</text>
    </g>
    
    <!-- R702W Structure box -->
    <g transform="translate(780, 55)">
      <rect x="0" y="0" width="580" height="420" rx="10" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
      <rect x="0" y="0" width="580" height="45" rx="10" fill="#C75050"/>
      <rect x="0" y="35" width="580" height="10" fill="#C75050"/>
      <text x="290" y="30" font-family="Calisto MT, Georgia, serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">R702W Mutant NOD2</text>
      
      <!-- Image placeholder -->
      <rect x="15" y="55" width="550" height="300" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-dasharray="5,5"/>
      <text x="290" y="200" font-family="Arial, sans-serif" font-size="14" fill="#999" text-anchor="middle">[img2_r702w_full_ISEF.png]</text>
      <text x="290" y="220" font-family="Arial, sans-serif" font-size="11" fill="#bbb" text-anchor="middle">Place full structure image here</text>
      
      <!-- Mutation callout -->
      <g transform="translate(15, 365)">
        <circle cx="8" cy="6" r="8" fill="#00FFFF" stroke="#C75050" stroke-width="2"/>
        <text x="25" y="10" font-family="Arial, sans-serif" font-size="10" fill="#C75050" font-weight="bold">R702W Mutation (HD2 domain)</text>
        <text x="280" y="10" font-family="Arial, sans-serif" font-size="10" fill="#666">79.4 Å from binding site</text>
      </g>
      
      <!-- Status -->
      <text x="290" y="405" font-family="Calisto MT, Georgia, serif" font-size="14" fill="#C75050" text-anchor="middle" font-weight="bold">Crohn's Disease Risk ↑3x</text>
    </g>
    
    <!-- VS connector -->
    <circle cx="720" cy="320" r="25" fill="white" stroke="#E8825E" stroke-width="2"/>
    <text x="720" y="326" font-family="Calisto MT, Georgia, serif" font-size="16" font-weight="bold" fill="#E8825E" text-anchor="middle">vs</text>
  </g>
  
  <!-- Arrow down to drug binding -->
  <line x1="720" y1="765" x2="720" y2="805" stroke="#E8825E" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- ==================== SECTION 3: DRUG BINDING ==================== -->
  <g transform="translate(0, 820)">
    <!-- Section header -->
    <rect x="40" y="0" width="1360" height="40" rx="6" fill="#E8825E" opacity="0.15"/>
    <text x="720" y="28" font-family="Calisto MT, Georgia, serif" font-size="18" font-weight="bold" fill="#E8825E" text-anchor="middle">DRUG BINDING ANALYSIS</text>
    
    <!-- Bufadienolide box -->
    <g transform="translate(80, 55)">
      <rect x="0" y="0" width="580" height="340" rx="10" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
      <rect x="0" y="0" width="580" height="45" rx="10" fill="#00CED1"/>
      <rect x="0" y="35" width="580" height="10" fill="#00CED1"/>
      <text x="290" y="30" font-family="Calisto MT, Georgia, serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Bufadienolide</text>
      
      <!-- Image placeholder -->
      <rect x="15" y="55" width="550" height="200" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-dasharray="5,5"/>
      <text x="290" y="150" font-family="Arial, sans-serif" font-size="14" fill="#999" text-anchor="middle">[pocket_bufa_wt.png]</text>
      <text x="290" y="170" font-family="Arial, sans-serif" font-size="11" fill="#bbb" text-anchor="middle">Cyan spheres in pocket</text>
      
      <!-- FEP Data -->
      <g transform="translate(15, 265)">
        <rect x="0" y="0" width="265" height="60" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
        <text x="132" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">WT Binding</text>
        <text x="132" y="42" font-family="Calisto MT, Georgia, serif" font-size="20" fill="#2E7D32" text-anchor="middle" font-weight="bold">ΔG = -9.2 kcal/mol</text>
        
        <rect x="285" y="0" width="265" height="60" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
        <text x="417" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">R702W Binding</text>
        <text x="417" y="42" font-family="Calisto MT, Georgia, serif" font-size="20" fill="#2E7D32" text-anchor="middle" font-weight="bold">ΔG = -9.0 kcal/mol</text>
      </g>
      
      <!-- Status badge -->
      <rect x="180" y="320" width="220" height="25" rx="12" fill="#4CAF50"/>
      <text x="290" y="338" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">✓ MUTATION RESISTANT</text>
    </g>
    
    <!-- Febuxostat box -->
    <g transform="translate(780, 55)">
      <rect x="0" y="0" width="580" height="340" rx="10" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
      <rect x="0" y="0" width="580" height="45" rx="10" fill="#FF8C00"/>
      <rect x="0" y="35" width="580" height="10" fill="#FF8C00"/>
      <text x="290" y="30" font-family="Calisto MT, Georgia, serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Febuxostat</text>
      
      <!-- Image placeholder -->
      <rect x="15" y="55" width="550" height="200" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-dasharray="5,5"/>
      <text x="290" y="150" font-family="Arial, sans-serif" font-size="14" fill="#999" text-anchor="middle">[pocket_febu_wt.png]</text>
      <text x="290" y="170" font-family="Arial, sans-serif" font-size="11" fill="#bbb" text-anchor="middle">Orange spheres in pocket</text>
      
      <!-- FEP Data -->
      <g transform="translate(15, 265)">
        <rect x="0" y="0" width="265" height="60" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
        <text x="132" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">WT Binding</text>
        <text x="132" y="42" font-family="Calisto MT, Georgia, serif" font-size="20" fill="#2E7D32" text-anchor="middle" font-weight="bold">ΔG = -8.5 kcal/mol</text>
        
        <rect x="285" y="0" width="265" height="60" rx="6" fill="#FFEBEE" stroke="#F44336" stroke-width="1"/>
        <text x="417" y="20" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">R702W Binding</text>
        <text x="417" y="42" font-family="Calisto MT, Georgia, serif" font-size="20" fill="#C62828" text-anchor="middle" font-weight="bold">ΔG = -6.1 kcal/mol</text>
      </g>
      
      <!-- Status badge -->
      <rect x="180" y="320" width="220" height="25" rx="12" fill="#F44336"/>
      <text x="290" y="338" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">✗ 50× WEAKER BINDING</text>
    </g>
    
    <!-- VS connector -->
    <circle cx="720" cy="225" r="25" fill="white" stroke="#E8825E" stroke-width="2"/>
    <text x="720" y="231" font-family="Calisto MT, Georgia, serif" font-size="16" font-weight="bold" fill="#E8825E" text-anchor="middle">vs</text>
  </g>
  
  <!-- Arrow down to signaling -->
  <line x1="720" y1="1225" x2="720" y2="1265" stroke="#E8825E" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- ==================== SECTION 4: DOWNSTREAM SIGNALING ==================== -->
  <g transform="translate(0, 1280)">
    <!-- Section header -->
    <rect x="40" y="0" width="1360" height="40" rx="6" fill="#E8825E" opacity="0.15"/>
    <text x="720" y="28" font-family="Calisto MT, Georgia, serif" font-size="18" font-weight="bold" fill="#E8825E" text-anchor="middle">DOWNSTREAM SIGNALING CASCADE</text>
    
    <!-- Signaling pathway -->
    <g transform="translate(0, 60)">
      <!-- NOD2 Activation -->
      <rect x="120" y="20" width="160" height="70" rx="10" fill="#E8825E" filter="url(#shadow)"/>
      <text x="200" y="50" font-family="Calisto MT, Georgia, serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">NOD2</text>
      <text x="200" y="70" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Activated</text>
      
      <!-- Arrow -->
      <line x1="285" y1="55" x2="355" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrowheadBig)"/>
      
      <!-- RIPK2 -->
      <rect x="360" y="20" width="160" height="70" rx="10" fill="#5C6BC0" filter="url(#shadow)"/>
      <text x="440" y="50" font-family="Calisto MT, Georgia, serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">RIPK2</text>
      <text x="440" y="70" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Kinase</text>
      
      <!-- Arrow -->
      <line x1="525" y1="55" x2="595" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrowheadBig)"/>
      
      <!-- IKK Complex -->
      <rect x="600" y="20" width="160" height="70" rx="10" fill="#7E57C2" filter="url(#shadow)"/>
      <text x="680" y="50" font-family="Calisto MT, Georgia, serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">IKK</text>
      <text x="680" y="70" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Complex</text>
      
      <!-- Arrow -->
      <line x1="765" y1="55" x2="835" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrowheadBig)"/>
      
      <!-- NF-κB -->
      <rect x="840" y="20" width="160" height="70" rx="10" fill="#AB47BC" filter="url(#shadow)"/>
      <text x="920" y="50" font-family="Calisto MT, Georgia, serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">NF-κB</text>
      <text x="920" y="70" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Transcription</text>
      
      <!-- Arrow -->
      <line x1="1005" y1="55" x2="1075" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrowheadBig)"/>
      
      <!-- Inflammation -->
      <rect x="1080" y="10" width="200" height="90" rx="10" fill="#EF5350" filter="url(#shadow)"/>
      <text x="1180" y="40" font-family="Calisto MT, Georgia, serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">INFLAMMATION</text>
      <text x="1180" y="60" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">IL-1β, IL-6, TNF-α</text>
      <text x="1180" y="78" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Antimicrobial peptides</text>
      
      <!-- Drug intervention callout -->
      <g transform="translate(120, 110)">
        <rect x="0" y="0" width="300" height="55" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1"/>
        <text x="150" y="20" font-family="Arial, sans-serif" font-size="12" fill="#1976D2" text-anchor="middle" font-weight="bold">💊 Drug Target</text>
        <text x="150" y="40" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle">Bufadienolide binds LRR domain</text>
      </g>
    </g>
  </g>
  
  <!-- ==================== SECTION 5: KEY FINDING ==================== -->
  <g transform="translate(0, 1520)">
    <!-- Key finding box -->
    <rect x="120" y="0" width="1200" height="140" rx="12" fill="white" stroke="#E8825E" stroke-width="3" filter="url(#shadow)"/>
    <rect x="120" y="0" width="1200" height="50" rx="12" fill="#E8825E"/>
    <rect x="120" y="40" width="1200" height="10" fill="#E8825E"/>
    <text x="720" y="35" font-family="Calisto MT, Georgia, serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">KEY FINDING</text>
    
    <text x="720" y="85" font-family="Calisto MT, Georgia, serif" font-size="18" fill="#333" text-anchor="middle">
      Bufadienolide maintains strong binding affinity regardless of R702W mutation status
    </text>
    <text x="720" y="115" font-family="Calisto MT, Georgia, serif" font-size="16" fill="#E8825E" text-anchor="middle" font-weight="bold">
      → Potential mutation-resistant therapeutic for Crohn's disease patients
    </text>
  </g>
  
  <!-- ==================== BOTTOM LEGEND ==================== -->
  <g transform="translate(40, 1680)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#888">
      Structures: AlphaFold2 predicted | Docking: GNINA CNN | FEP: GROMACS + pmx | ML: XGBoost NOD2-Scout
    </text>
  </g>
  
  <!-- ==================== ALLOSTERIC MECHANISM CALLOUT ==================== -->
  <g transform="translate(40, 1720)">
    <rect x="0" y="0" width="1360" height="80" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
    <text x="680" y="30" font-family="Calisto MT, Georgia, serif" font-size="16" font-weight="bold" fill="#E65100" text-anchor="middle">ALLOSTERIC MECHANISM</text>
    <text x="680" y="55" font-family="Calisto MT, Georgia, serif" font-size="14" fill="#333" text-anchor="middle">
      R702W mutation (HD2 domain) affects binding 79.4 Å away (LRR domain) through conformational changes
    </text>
    <text x="680" y="75" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">
      Bufadienolide resists this allosteric effect | Febuxostat is sensitive (50× weaker binding in mutant)
    </text>
  </g>
  
  <!-- ==================== FOOTER ==================== -->
  <rect x="40" y="1870" width="1360" height="35" rx="6" fill="url(#headerGrad)" opacity="0.3"/>
  <text x="720" y="1893" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">
    Deep Learning Guided Discovery and FEP Validation of NOD2 Binders for the R702W Crohn's Disease Mutation
  </text>
  
</svg>
